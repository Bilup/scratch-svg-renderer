name: Build and Deploy Dist

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout develop
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - run: npm ci
    - run: npm run build
    - run: npm test

    # Save dist as artifact for next job
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Deploy to develop-builds
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Move dist safely
        cp -r dist /tmp/dist

        # Switch or create branch
        git fetch origin
        git checkout develop-builds || git checkout -b develop-builds

        # Clean branch
        git rm -rf . || true

        # Restore build
        cp -r /tmp/dist/* .

        # Commit & push
        git add -f .
        git commit -m "chore: update build from develop" || echo "No changes"
        git push origin develop-builds
